<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Navy background tile with subtle border -->
  <rect width="512" height="512" rx="64" fill="#0B1733"/>
  <rect x="1" y="1" width="510" height="510" rx="63" fill="none" stroke="#2A3B5E" stroke-width="1"/>

  <!-- Mission progress ring (echoes the gauge in the app) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1A2B4D" stroke-width="3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#4FC3F7" stroke-width="3"
          stroke-dasharray="420 1256" stroke-linecap="round" opacity="0.7"
          transform="rotate(-90 256 256)"/>

  <!-- Bracket-wrapped S with neon glow -->
  <g filter="url(#cyanGlow)">
    <!-- Left bracket -->
    <path d="M 124 170 L 96 170 L 96 342 L 124 342"
          fill="none" stroke="#4FC3F7" stroke-width="12"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Right bracket -->
    <path d="M 388 170 L 416 170 L 416 342 L 388 342"
          fill="none" stroke="#4FC3F7" stroke-width="12"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- S character -->
    <text x="256" y="312" font-size="156" font-weight="700"
          fill="#4FC3F7" text-anchor="middle"
          letter-spacing="-4">S</text>
  </g>
</svg>
