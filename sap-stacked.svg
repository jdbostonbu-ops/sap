<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Navy background with subtle border -->
  <rect width="700" height="280" rx="12" fill="#0B1733" stroke="#2A3B5E" stroke-width="1"/>

  <!-- Top accent line (echoes the SANS @RISK advisory ticker in the app) -->
  <rect x="40" y="30" width="60" height="2" fill="#FF3B5C"/>
  <text x="110" y="38" font-size="10" font-weight="500"
        fill="#FF3B5C" text-anchor="start" letter-spacing="2">
    SECURITY TRAINING
  </text>

  <!-- Top-right status indicator (echoes the LIVE INTEL FEED dot) -->
  <circle cx="660" cy="36" r="4" fill="#00FF94"/>
  <text x="652" y="40" font-size="10" font-weight="500"
        fill="#A8B5CC" text-anchor="end" letter-spacing="2">
    OPERATIONAL
  </text>

  <!-- Bracket wordmark, centered, big -->
  <g filter="url(#cyanGlow)">
    <path d="M 198 94 L 178 94 L 178 168 L 198 168"
          fill="none" stroke="#4FC3F7" stroke-width="6"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="350" y="155" font-size="78" font-weight="700"
          fill="#4FC3F7" text-anchor="middle"
          letter-spacing="8">SAP</text>
    <path d="M 502 94 L 522 94 L 522 168 L 502 168"
          fill="none" stroke="#4FC3F7" stroke-width="6"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Full name -->
  <text x="350" y="208" font-size="15" font-weight="500"
        fill="#E6EEF8" text-anchor="middle" letter-spacing="6">
    SECURITY AWARENESS PLATFORM
  </text>

  <!-- Italic tagline in serif (deliberate contrast) -->
  <text x="350" y="238" font-size="12" font-weight="400"
        fill="#A8B5CC" text-anchor="middle" letter-spacing="2"
        font-family="'Inter', sans-serif" font-style="italic">
    Train like you're already on shift.
  </text>
</svg>
